<script>
(function() {
  var preview = document.getElementById('preview-wallpaper');
  var fileInput = document.getElementById('wallpaper-file');
  var btnAlbum = document.getElementById('btn-album');
  var btnSet = document.getElementById('btn-set-wallpaper');
  var galleryItems = document.querySelectorAll('.gallery-item > div:first-child');
  var currentUrl = '';

  function setPreview(url) {
    preview.style.backgroundImage = 'url(' + url + ')';
    currentUrl = url;
  }

  if (btnAlbum && fileInput) {
    btnAlbum.addEventListener('click', function() { fileInput.click(); });
    fileInput.addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) { setPreview(ev.target.result); };
      reader.readAsDataURL(file);
    });
  }

  galleryItems.forEach(function(item) {
    item.addEventListener('click', function() {
      var style = item.getAttribute('style') || '';
      var match = style.match(/background-image:\s*url\(['"]?([^'"\)]+)['"]?\)/);
      if (match && match[1]) setPreview(match[1]);
    });
  });

  function applyWallpaper() {
    if (!currentUrl) return;
    localStorage.setItem('diy_wallpaper', currentUrl);
    location.replace('index.html');
  }

  if (btnSet) {
    btnSet.addEventListener('click', applyWallpaper);
  }

  var btnCheck = document.getElementById('btn-check');
  if (btnCheck) {
    btnCheck.addEventListener('click', applyWallpaper);
  }
})();
</script>
