<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">

  <!-- 视口：覆盖刘海/灵动岛安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS PWA 元标签 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="主屏幕">
  <meta name="theme-color" content="#FFFFFF">

  <link rel="manifest" href="manifest.json">
  <style>/* ===== 重置：纯白、无滚动、从屏幕最顶端开始 ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
  background: #FFFFFF; /* 纯白壁纸，无渐变、无图案 */
}

body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation; /* 抑制双击缩放 */
}

/* ===== Dock：真实 iOS 程序坞位置，位于 Home 指示条上方 ===== */
.dock {
  position: fixed;
  bottom: env(safe-area-inset-bottom);
  left: 12px;
  right: 12px;
  height: 90px;
  border-radius: 28px;
  border: none; /* 无可见边框，仅靠毛玻璃边缘 */
  background: rgba(0, 0, 0, 0.08);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.45); /* 极淡顶部高光，增强玻璃质感 */
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  padding: 0 8px;
}

/* ===== 应用图标：坐在毛玻璃盘子上的效果 ===== */
.dock-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  border: none;
  background: none;
  font: inherit;
  cursor: pointer;
  -webkit-touch-callout: none;
}

.dock-app .icon {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  border: none; /* 无边框 */
  background: rgba(255, 255, 255, 0.42); /* 半透明 + 模糊，非实色 */
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.65), /* 内侧高光 */
    inset 0 -1px 2px rgba(0, 0, 0, 0.04);      /* 内侧底部阴影 */
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.16s ease;
}

/* 图标下的小标签：系统字体 */
.dock-app .label {
  font-size: 11px;
  line-height: 1;
  color: #1C1C1E;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

/* ===== 按压反馈（iOS 式轻缩） ===== */
.dock-app:active .icon,
.dock-app .icon.pressed {
  transform: scale(0.88);
}
</style>
  <title>主屏幕</title>
</head>
<body>

  <!-- 唯一的 UI：底部 Dock（无状态栏、无图标区、无页面圆点） -->
  <nav class="dock" aria-label="程序坞">

    <button class="dock-app" type="button" aria-label="电话">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3C3C43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </span>
      <span class="label">电话</span>
    </button>

    <button class="dock-app" type="button" aria-label="Safari 浏览器">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3C3C43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"></polygon>
        </svg>
      </span>
      <span class="label">Safari</span>
    </button>

    <button class="dock-app" type="button" aria-label="信息">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3C3C43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </span>
      <span class="label">信息</span>
    </button>

    <button class="dock-app" type="button" aria-label="音乐">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3C3C43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </span>
      <span class="label">音乐</span>
    </button>

  </nav>

  <script src="#" defer=""></script>


</body></html>
