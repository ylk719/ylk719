<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#dbe7fb" />
    <title>AI Chat Home Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260727b" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone-stage" aria-label="仿苹果手机主页">
        <div class="phone-bg">
          <div class="blur-orb orb-a"></div>
          <div class="blur-orb orb-b"></div>
          <div class="blur-orb orb-c"></div>
          <div class="star-layer"></div>
        </div>

        <div class="pages-viewport" id="pagesViewport">
          <div class="pages-track" id="pagesTrack">
            <section class="home-page page-main" aria-label="主页一">
              <div class="page-scroll">
                <section class="choice-stack" id="choiceStack"></section>

                <p class="section-tag">Top Widgets</p>

                <section class="icon-grid" id="iconGridPrimary"></section>

                <section class="photobook-card">
                  <div class="card-head">
                    <h2 id="photoTitle">PhotoBook</h2>
                    <p id="photoDate">今日 周日</p>
                  </div>

                  <div class="card-body">
                    <div class="photo-strip" id="photoStrip"></div>
                    <button
                      class="favorite-btn"
                      id="favoriteBtn"
                      type="button"
                      aria-label="收藏"
                      aria-pressed="false"
                    >
                      <span class="heart-outline"></span>
                    </button>
                  </div>
                </section>

                <p class="section-tag lower-tag">Top Widgets</p>
              </div>
            </section>

            <section class="home-page page-secondary" aria-label="主页二">
              <div class="page-scroll">
                <section class="secondary-hero">
                  <p class="secondary-kicker" id="secondaryKicker">AI Chat Space</p>
                  <h2 class="secondary-title" id="secondaryTitle">第二页可左右滑动</h2>
                  <p class="secondary-text" id="secondaryText">
                    这里保留手机主页的第二屏，用来放更多图标、聊天入口或小组件。
                  </p>
                </section>

                <section class="icon-grid secondary-grid" id="iconGridSecondary"></section>

                <section class="widget-row" id="widgetRow"></section>
              </div>
            </section>
          </div>
        </div>

        <div class="bottom-ui">
          <div class="page-dots" id="pageDots" aria-label="页面切换指示器"></div>

          <nav class="dock" id="dockBar" aria-label="底部快捷栏"></nav>
        </div>
      </section>
    </main>

    <script src="./script.js?v=20260727b"></script>
  </body>
</html>
