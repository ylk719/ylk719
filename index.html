<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- PWA / 全屏 Web App 配置（纯内联，无需外部文件） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="主屏幕">
    <meta name="theme-color" content="#ffffff">
    <meta name="format-detection" content="telephone=no">

    <!-- 内联 manifest（Android PWA 支持，无需外部 json 文件） -->
    <link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;主屏幕&quot;,&quot;short_name&quot;:&quot;主屏幕&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;orientation&quot;:&quot;portrait&quot;,&quot;background_color&quot;:&quot;#ffffff&quot;,&quot;theme_color&quot;:&quot;#ffffff&quot;,&quot;start_url&quot;:&quot;./index.html&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns=" http:="" www.w3.org="" 2000="" svg'="" viewbox="0 0 512 512" %3e%3crect="" width="512" height="512" rx="112" fill="%230d9488" %3e%3c="" svg%3e","sizes":"512x512","type":"image="" svg+xml"}]}'="">
    <!-- 内联 favicon（SVG data URI） -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d9488'/%3E%3C/svg%3E">

    <style>/* ========================================
   仿 iPhone 主屏幕 — 全屏 Web App（仅 Dock）
   白色壁纸 + 毛玻璃 Dock + App 名称
   ======================================== */

/* ---- Reset & Base ---- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #fff;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* ---- 主屏幕容器（Home 容器） ---- */
.home-screen {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* ---- 壁纸背景（白色） ---- */
.wallpaper {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 0;
}

/* ---- Dock（底部固定栏） ---- */
.dock {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 6px env(safe-area-inset-bottom, 0px);
    z-index: 3;
    pointer-events: none;
}

.dock-inner {
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 104px;
    border-radius: 34px;
    /* 毛玻璃效果 — 降低不透明度增强通透感 */
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(42px) saturate(180%);
    -webkit-backdrop-filter: blur(42px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.6);
    box-shadow:
        0 4px 24px rgba(0,0,0,0.06),
        inset 0 1px 0 rgba(255,255,255,0.7);
    padding: 0 14px;
    margin: 0 4px;
    pointer-events: auto;
    animation: dockAppear 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both;
}

@keyframes dockAppear {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---- Dock App（图标 + 名称容器） ---- */
.dock-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.12s ease;
}

.dock-app:active {
    transform: scale(0.86);
    transition: transform 0.06s ease;
}

/* ---- Dock App 图标（毛玻璃质感） ---- */
.dock-app-icon {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    /* 毛玻璃效果 — 极低透明度，让底部柔彩带透过模糊可见 */
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.5);
    box-shadow:
        0 2px 8px rgba(0,0,0,0.04),
        inset 0 1px 0 rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* 图标顶部高光 */
.dock-app-icon::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
    border-radius: 14px 14px 0 0;
    pointer-events: none;
}

/* SVG 图标（实心、不透明，清晰显示在毛玻璃背景之上） */
.dock-app-icon svg {
    position: relative;
    z-index: 1;
    /* 不使用降低不透明度的滤镜，保持图案实心清晰 */
    animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes iconPop {
    from { opacity: 0; transform: scale(0.4); }
    to   { opacity: 1; transform: scale(1); }
}

/* ---- App 名称 ---- */
.dock-app-name {
    font-size: 10px;
    line-height: 1.2;
    color: #1c1c1e;
    text-align: center;
    max-width: 68px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 400;
    letter-spacing: 0.1px;
}

/* ---- 响应式适配（保持与原布局间隔一致） ---- */
@media (max-width: 360px) {
    .dock-app-icon {
        width: 54px;
        height: 54px;
    }
    .dock-inner { height: 98px; border-radius: 30px; }
    .dock-app-name { font-size: 9px; }
}

@media (min-width: 414px) {
    .dock-app-icon {
        width: 64px;
        height: 64px;
    }
    .dock-inner { height: 112px; border-radius: 36px; }
    .dock-app-name { font-size: 11px; }
}

/* ---- 横屏隐藏（仅支持竖屏） ---- */
@media (orientation: landscape) and (max-height: 500px) {
    .home-screen {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .home-screen::before {
        content: '请旋转至竖屏使用';
        color: rgba(0,0,0,0.5);
        font-size: 16px;
        z-index: 10;
    }
    .dock { display: none; }
}
</style>
    <title>主屏幕</title>
</head>
<body>
    <div class="home-screen">
        <!-- 壁纸背景（白色） -->
        <div class="wallpaper"></div>

        <!-- Dock（底部固定栏） -->
        <div class="dock" id="dock">
            <div class="dock-inner" id="dockInner"></div>
        </div>
    </div>

    <script src="#"></script>


</body></html>
