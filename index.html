<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iOS Desktop">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="apple-touch-icon-precomposed" href="icon-180.png">
  <title>iOS Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <!-- 桌面滑动容器 -->
    <div id="pages-wrapper">
      <!-- 第一屏 -->
      <div class="page" id="page-1">
        <div class="page-content">
          <!-- 搜索框 -->
          <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="搜索" readonly>
          </div>
          <!-- 第一屏图标网格 -->
          <div class="icon-grid">
            <!-- Row 1 -->
            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #FF6B6B, #FF3B30);">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                  <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z"/>
                </svg>
              </div>
              <span class="icon-label">新闻</span>
            </div>
            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #5AC8FA, #007AFF);">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                  <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
              </div>
              <span class="icon-label">电话</span>

            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #34C759, #248A3D);">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
              </div>
              <span class="icon-label">Safari</span>
            </div>
            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #FF9500, #FF6900);">

                </svg>
              </div>

              <div class="icon-face" style="background: linear-gradient(135deg, #64D2FF, #0A84FF);">

            </div>
            <!-- Row 3 -->
            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #30D158, #248A3D);">

              </div>
              <span class="icon-label">邮件</span>
            </div>
          </div>
        </div>
        <!-- 页面指示点 -->
        <div class="page-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- 第二屏 -->

            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #FF9F0A, #FF6900);">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                  <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>

                </svg>
              </div>
              <span class="icon-label">语音备忘</span>

              <div class="icon-face" style="background: linear-gradient(135deg, #30B0C7, #0A84FF);">

                </svg>
              </div>

                  <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>

            </div>
            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #FFD60A, #FFCC00);">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>

            </div>
            <div class="icon-item">
              <div class="icon-face" style="background: linear-gradient(135deg, #32ADE6, #5AC8FA);">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                  <path d="M3 5H1v16c0 1.1.9 2 2 2h16v-2H3V5zm18-4H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 16H7V3h14v14zm-8-2h2v-2h2v-2h-2V7h-2v6h-2v2h2z"/>

        <div class="page-dots">
          <div class="dot"></div>
          <div class="dot active"></div>

    <!-- 固定Dock栏 -->

        <div class="dock-icon">
          <div class="icon-face dock-face" style="background: linear-gradient(135deg, #34C759, #248A3D);">
            <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
              <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
