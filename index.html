<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- PWA / 全屏 Web App 配置 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="主屏幕">
    <meta name="theme-color" content="#fce4ec">
    <meta name="format-detection" content="telephone=no">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23fce4ec'/%3E%3C/svg%3E">

    <style>/* ========================================
   仿 iPhone 主屏幕 — 全屏 Web App（仅 Dock）
   淡粉色壁纸 + 毛玻璃 Dock + App 名称
   ======================================== */

/* ---- Reset & Base ---- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

html, body {
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
    background: #fce4ec;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
}

/* ---- 主屏幕容器（Home 容器） ---- */
.home-screen {
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
}

/* ---- 壁纸背景（淡粉色） ---- */
.wallpaper {
    position: fixed;
    inset: 0;
    background: #fce4ec;
    z-index: 0;
}

/* ---- Dock（底部固定栏） ---- */
.dock {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 6px;
    padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
    z-index: 3;
    pointer-events: none;
}

.dock-inner {
    display: flex;
    align-items: center;
    justify-content: space-around;
    height: 104px;
    border-radius: 34px;
    background: rgba(255, 255, 255, 0.55);
    -webkit-backdrop-filter: blur(42px) saturate(180%);
    backdrop-filter: blur(42px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    padding: 0 14px;
    margin: 0 4px;
    pointer-events: auto;
}

/* ---- Dock App（图标 + 名称容器） ---- */
.dock-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    -webkit-transition: -webkit-transform 0.12s ease;
    transition: transform 0.12s ease;
}

.dock-app:active {
    -webkit-transform: scale(0.86);
    transform: scale(0.86);
    -webkit-transition: -webkit-transform 0.06s ease;
    transition: transform 0.06s ease;
}

/* ---- Dock App 图标（毛玻璃质感） ---- */
.dock-app-icon {
    width: 58px;
    height: 58px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.5);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

/* 图标顶部高光 */
.dock-app-icon::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0));
    border-radius: 14px 14px 0 0;
    pointer-events: none;
}

/* SVG 图标 */
.dock-app-icon svg {
    position: relative;
    z-index: 1;
    display: block;
    width: 33px;
    height: 33px;
    flex-shrink: 0;
}

/* ---- App 名称 ---- */
.dock-app-name {
    font-size: 10px;
    line-height: 1.2;
    color: #5a5a5a;
    text-align: center;
    max-width: 68px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 400;
    letter-spacing: 0.1px;
}

/* ---- 响应式适配 ---- */
@media (max-width: 360px) {
    .dock-app-icon {
        width: 54px;
        height: 54px;
    }
    .dock-app-icon svg {
        width: 30px;
        height: 30px;
    }
    .dock-inner { height: 98px; border-radius: 30px; }
    .dock-app-name { font-size: 9px; }
}

@media (min-width: 414px) {
    .dock-app-icon {
        width: 64px;
        height: 64px;
    }
    .dock-app-icon svg {
        width: 36px;
        height: 36px;
    }
    .dock-inner { height: 112px; border-radius: 36px; }
    .dock-app-name { font-size: 11px; }
}

/* ---- 横屏隐藏 ---- */
@media (orientation: landscape) and (max-height: 500px) {
    .home-screen {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .home-screen::before {
        content: '请旋转至竖屏使用';
        color: rgba(0, 0, 0, 0.5);
        font-size: 16px;
        z-index: 10;
    }
    .dock { display: none; }
}
</style>
    <title>主屏幕</title>
</head>
<body>
    <div class="home-screen">
        <div class="wallpaper"></div>

        <div class="dock" id="dock">
            <div class="dock-inner" id="dockInner">
                <!-- 降级：如果 JS 未执行，至少显示文字 -->
                <noscript>请启用 JavaScript</noscript>
            </div>
        </div>
    </div>

    <script src="#"></script>


</body></html>
